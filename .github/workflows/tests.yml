name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development profile
        run: python -m pip install -e ".[dev,retrieval,parsers,chunkers,web,mcp]"
      - name: Validate EKS
        run: python scripts/validation/validate_eks.py
      - name: Run tests
        run: python -m pytest -q
