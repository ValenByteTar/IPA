name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development profile
        run: python -m pip install -e ".[dev,retrieval,parsers,chunkers,web,mcp]"
      - name: Validate EKS
        run: python scripts/validation/validate_eks.py
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=line > /tmp/pytest.log 2>&1
          status=$?
          echo "--- pytest exit=$status ---"
          tail -80 /tmp/pytest.log
          # El log de Actions no es legible sin autenticarse, pero las
          # anotaciones de check-run y el step summary SI son publicos:
          # publicamos el tail ahi para poder diagnosticar sin credenciales.
          {
            echo '### pytest tail'
            echo '```text'
            tail -80 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            summary=$(tail -60 /tmp/pytest.log | sed 's/%/%25/g; s/\r//g' \
                      | awk 'NR > 1 { printf "%%0A" } { printf "%s", $0 }')
            echo "::error title=pytest failures::$summary"
          fi
          exit "$status"
